
<!DOCTYPE html>
<html>
<body>
<script>
  let n = 6;
  let sum = 0;

  for (let i = 1; i < n; i++) {
    if (n % i == 0) {
      sum = sum + i;
    }
  }

  if (sum == n) {
    console.log("Perfect Number");
  } else {
    console.log("Not a Perfect Number");
  }
</script>
</body>
</html>
