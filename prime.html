
<!DOCTYPE html>
<html>
<body>
<script>
  let n = 7;
  let prime = true;

  if (n <= 1) {
    prime = false;
  } else {
    for (let i = 2; i < n; i++) {
      if (n % i == 0) {
        prime = false;
        break;
      }
    }
  }

  if (prime) {
    console.log("Prime Number");
  } else {
    console.log("Not a Prime Number");
  }
</script>
</body>
</html>
